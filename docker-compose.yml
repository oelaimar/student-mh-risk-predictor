# Services:
#   postgres             Airflow metadata database
#   airflow-init         DB migration + admin user creation (runs once, then exits)
#   airflow-webserver    Airflow UI   -> http://localhost:8080
#   airflow-scheduler    Runs the DAG tasks
#   streamlit            App          -> http://localhost:8501
#   jupyter (dev)        Notebooks    -> http://localhost:8888

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: mental-health/airflow:latest
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me}
    PROJECT_ROOT: /opt/project
    PYTHONPATH: /opt/project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/project/src
    - ./data:/opt/project/data
    - ./models:/opt/project/models
    - ./reports:/opt/project/reports
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    image: mental-health/streamlit:latest
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro
      - ./data/sample:/app/data/sample:ro
      # Hot reload during development
      - ./app:/app/app
      - ./src:/app/src
    restart: unless-stopped

  jupyter:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    image: mental-health/jupyter:latest
    env_file: .env
    ports:
      - "8888:8888"
    volumes:
      - .:/project

volumes:
  postgres-db: